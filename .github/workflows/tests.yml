# Runs the offline test suite on every push and pull request.
#
# No secrets needed: the tests cover parsing, chunking, retrieval and the
# outage fallbacks without calling Voyage or Claude. Both ends of the
# supported Python range are checked, since the README promises 3.10+.

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
